name: Secret Scanning

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    name: Detect Secrets

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install detect-secrets
      run: |
        pip install detect-secrets

    - name: Run detect-secrets scan
      run: |
        detect-secrets scan --baseline .secrets.baseline --update .secrets.baseline

    - name: Verify no new secrets
      run: |
        # Check if baseline was updated (new secrets found)
        if ! git diff --exit-code .secrets.baseline; then
          echo "::error::New secrets detected! Please review and update .secrets.baseline"
          exit 1
        fi

    - name: Upload scan results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: secrets-scan-results
        path: .secrets.baseline
        retention-days: 30
