name: Secret Scanning

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    name: Detect Secrets

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install detect-secrets
      run: |
        pip install detect-secrets

    - name: Run detect-secrets scan
      run: |
        # Scan for secrets and compare against baseline
        # The --baseline flag will exclude known false positives marked as is_verified: true
        detect-secrets scan --baseline .secrets.baseline > scan-results.json || true

        # Check if any new secrets were found (not in baseline)
        if [ -s scan-results.json ]; then
          NEW_SECRETS=$(python3 -c "import json; data=json.load(open('scan-results.json')); print(sum(len(v) for v in data.get('results', {}).values()))")
          if [ "$NEW_SECRETS" -gt 0 ]; then
            echo "::error::Found $NEW_SECRETS new secret(s) not in baseline"
            cat scan-results.json
            exit 1
          fi
        fi

        echo "✅ No new secrets detected"

    - name: Upload scan results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: secrets-scan-results
        path: .secrets.baseline
        retention-days: 30
