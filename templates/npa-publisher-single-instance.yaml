---
AWSTemplateFormatVersion: 2010-09-09
Description: "NPA Publisher Dual Instance Multi-AZ (No Auto Scaling) 2.0 - Deploys two NPA Publishers across two availability zones for redundancy"

Metadata:
  cfnlint:
    config:
      ignore_checks:
        - W3002
        - W2001
        - E3030
  AWS::CloudFormation::Interface:
    ParameterGroups:
      -
        Label:
          default: "Netskope tenant info"
        Parameters:
          - NetskopeTenantFQDN
          - ProvisionNewAPIToken
          - ExistingNetskopeAPITokenARN
          - NetskopeAPIToken
      -
        Label:
          default: "VPC Configuration"
        Parameters:
          - CreateNewVPC
          - VPCCIDR
          - PublicSubnetCIDR
          - PrivateSubnetCIDR
          - AvailabilityZone
          - PublicSubnetCIDR2
          - PrivateSubnetCIDR2
          - AvailabilityZone2
          - ExistingVPC
          - ExistingPrivateSubnet
          - ExistingPrivateSubnet2
      -
        Label:
          default: "Netskope NPA Publisher info"
        Parameters:
          - NPAPublisherGroupName
          - NPAPublisherAMIId
          - NPAPublisherKey
          - NPAPublisherInstanceType
      -
        Label:
          default: "Lambda deployment configuration"
        Parameters:
          - LambdaS3Bucket
          - LambdaS3Key
      -
        Label:
          default: "Cost allocation and tagging"
        Parameters:
          - CostCenterTag
          - ProjectTag
          - EnvironmentTag
    ParameterLabels:
      NetskopeTenantFQDN:
        default: Netskope tenant FQDN, for example mytenant.goskope.com
      ProvisionNewAPIToken:
        default: Choose if you'd like to create a new AWS Secrets Manager key for Netskope API token or to use the existing one
      ExistingNetskopeAPITokenARN:
        default: If you're using the existing AWS Secrets Manager secret for Netskope API token enter its ARN here
      NetskopeAPIToken:
        default: Netskope API v2 token if you're creating a new secret in AWS Secrets Manager
      VPC:
        default: VPC id where you'd like your NPA publisher to be deployed
      NPAPublisherSubnet:
        default: Select Private Subnet with internet connectivity via NAT Gateway
      NPAPublisherGroupName:
        default: NPA Publisher Group Name
      NPAPublisherAMIId:
        default: NPA publisher AMI id
      NPAPublisherKey:
        default: Access key for the EC2 instance
      NPAPublisherInstanceType:
        default: EC2 instance type for the publisher
      CostCenterTag:
        default: Cost center for billing and resource allocation
      ProjectTag:
        default: Project name for resource tracking and reporting
      EnvironmentTag:
        default: Environment type (Production, Staging, Development, Test)
      LambdaS3Bucket:
        default: S3 bucket name for Lambda package (bucket name only, not s3:// URI)
      LambdaS3Key:
        default: S3 key/path for Lambda package (e.g., npa-publisher-lambda.zip)

Parameters:
  NPAPublisherGroupName:
    Description: 'The NPA publisher group name. All private applications names served by this publisher should start with this value'
    Type: String
    MinLength: 3
    MaxLength: 64
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9-]*$'
    ConstraintDescription: 'Must start with a letter and contain only alphanumeric characters and hyphens'

  NPAPublisherAMIId:
    Description: 'NPA publisher AMI id'
    Type: AWS::EC2::Image::Id

  NPAPublisherKey:
    Description: 'NPA publisher KeyPair Name'
    Type: AWS::EC2::KeyPair::KeyName

  CreateNewVPC:
    Description: 'Create new VPC with NAT Gateway, or use existing VPC?'
    Type: String
    Default: 'no'
    AllowedValues:
      - 'yes'
      - 'no'

  VPCCIDR:
    Description: 'CIDR block for new VPC (only used if CreateNewVPC=yes)'
    Type: String
    Default: '10.0.0.0/16'
    AllowedPattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2]))$'

  PublicSubnetCIDR:
    Description: 'CIDR block for public subnet (only used if CreateNewVPC=yes)'
    Type: String
    Default: '10.0.1.0/24'
    AllowedPattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2]))$'

  PrivateSubnetCIDR:
    Description: 'CIDR block for private subnet (only used if CreateNewVPC=yes)'
    Type: String
    Default: '10.0.2.0/24'
    AllowedPattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2]))$'

  AvailabilityZone:
    Description: 'Availability Zone for subnets (only used if CreateNewVPC=yes, leave empty for auto-select)'
    Type: String
    Default: ''

  ExistingVPC:
    Description: 'Existing VPC ID (only used if CreateNewVPC=no)'
    Type: String
    Default: ''

  ExistingPrivateSubnet:
    Description: 'Existing private subnet with NAT Gateway in first AZ (only used if CreateNewVPC=no)'
    Type: String
    Default: ''

  AvailabilityZone2:
    Description: 'Second Availability Zone for subnets (only used if CreateNewVPC=yes, leave empty for auto-select)'
    Type: String
    Default: ''

  PublicSubnetCIDR2:
    Description: 'CIDR block for second public subnet (only used if CreateNewVPC=yes)'
    Type: String
    Default: '10.0.3.0/24'
    AllowedPattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2]))$'

  PrivateSubnetCIDR2:
    Description: 'CIDR block for second private subnet (only used if CreateNewVPC=yes)'
    Type: String
    Default: '10.0.4.0/24'
    AllowedPattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2]))$'

  ExistingPrivateSubnet2:
    Description: 'Existing private subnet with NAT Gateway in second AZ (only used if CreateNewVPC=no)'
    Type: String
    Default: ''

  NPAPublisherInstanceType:
    Description: 'EC2 instance type for NPA publisher'
    Type: String
    Default: 't3.large'
    AllowedValues:
      - 't3.medium'
      - 't3.large'
      - 't3.xlarge'
      - 't3.2xlarge'
      - 'm5.large'
      - 'm5.xlarge'
      - 'm5.2xlarge'

  NetskopeTenantFQDN:
    Description: 'Enter your Netskope tenant FQDN here (mytenant.goskope.com)'
    Type: String
    AllowedPattern: '^[a-z0-9][a-z0-9-]*\.goskope\.com$'
    ConstraintDescription: 'Must be a valid Netskope tenant FQDN ending with .goskope.com'

  ProvisionNewAPIToken:
    Default: 'yes'
    Description: 'Provision new Netskope API v2 token in AWS Secrets Manager?'
    AllowedValues:
      - 'yes'
      - 'no'
    Type: 'String'

  NetskopeAPIToken:
    NoEcho: true
    Default: ""
    Description: 'If new Netskope API v2 token has to be provisioned in AWS Secrets Manager, enter it here'
    Type: String

  ExistingNetskopeAPITokenARN:
    Description: 'If an existing Netskope API v2 token in AWS Secrets Manager will be used, enter the secret ARN here'
    Type: 'String'
    AllowedPattern: '^(arn:(aws|aws-cn|aws-us-gov):secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[a-zA-Z0-9/_+=.@-]+)?$'
    ConstraintDescription: 'Must be a valid AWS Secrets Manager secret ARN or empty'
    Default: 'arn:aws:secretsmanager:us-east-1:123456789012:secret:placeholder'

  CostCenterTag:
    Description: 'Cost center for resource allocation and billing'
    Type: String
    MinLength: 1
    MaxLength: 255
    Default: 'IT-Operations'

  ProjectTag:
    Description: 'Project identifier for resource tracking'
    Type: String
    MinLength: 1
    MaxLength: 255
    Default: 'NPA-Publisher-SingleInstance'

  EnvironmentTag:
    Description: 'Environment type (e.g., Production, Development, Staging)'
    Type: String
    Default: 'Production'
    AllowedValues:
      - 'Production'
      - 'Staging'
      - 'Development'
      - 'Test'

  LambdaS3Bucket:
    Description: 'S3 bucket name containing Lambda deployment package (bucket name only, not s3:// URI). Leave empty to use default Netskope bucket'
    Type: String
    Default: ''

  LambdaS3Key:
    Description: 'S3 key for Lambda deployment package (e.g., npa-publisher-lambda.zip or path/to/lambda.zip)'
    Type: String
    Default: 'npa-publisher-lambda.zip'

Conditions:
  ToProvisionNewAPIToken: !Equals
    - !Ref ProvisionNewAPIToken
    - 'yes'
  UseCustomLambdaBucket: !Not
    - !Equals
      - !Ref LambdaS3Bucket
      - ''
  CreateVPC: !Equals
    - !Ref CreateNewVPC
    - 'yes'
  UseExistingVPC: !Equals
    - !Ref CreateNewVPC
    - 'no'
  UseSpecificAZ: !Not
    - !Equals
      - !Ref AvailabilityZone
      - ''
  UseSpecificAZ2: !Not
    - !Equals
      - !Ref AvailabilityZone2
      - ''

Mappings:
  SourceCode:
    General:
      S3Bucket: 'netskope-marketplace'
      S3Prefix: "NPAPublisherAutoscalling"

Resources:
  # ==============================================================
  # VPC Resources (Conditional - only created if CreateNewVPC=yes)
  # ==============================================================
  VPC:
    Type: AWS::EC2::VPC
    Condition: CreateVPC
    Properties:
      CidrBlock: !Ref VPCCIDR
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${NPAPublisherGroupName}-VPC'
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: CreateVPC
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${NPAPublisherGroupName}-IGW'
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: CreateVPC
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Condition: CreateVPC
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnetCIDR
      AvailabilityZone:
        Fn::If:
          - UseSpecificAZ
          - !Ref AvailabilityZone
          - !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${NPAPublisherGroupName}-PublicSubnet'
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Condition: CreateVPC
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnetCIDR
      AvailabilityZone:
        Fn::If:
          - UseSpecificAZ
          - !Ref AvailabilityZone
          - !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${NPAPublisherGroupName}-PrivateSubnet'
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  NATGatewayEIP:
    Type: AWS::EC2::EIP
    Condition: CreateVPC
    DependsOn: AttachGateway
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${NPAPublisherGroupName}-NAT-EIP'
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  NATGateway:
    Type: AWS::EC2::NatGateway
    Condition: CreateVPC
    Properties:
      AllocationId: !GetAtt NATGatewayEIP.AllocationId
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: !Sub '${NPAPublisherGroupName}-NAT'
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateVPC
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${NPAPublisherGroupName}-PublicRT'
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  PublicRoute:
    Type: AWS::EC2::Route
    Condition: CreateVPC
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateVPC
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateVPC
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${NPAPublisherGroupName}-PrivateRT'
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  PrivateRoute:
    Type: AWS::EC2::Route
    Condition: CreateVPC
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NATGateway

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateVPC
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  # ==============================================================
  # Second AZ Resources (for two-instance deployment)
  # ==============================================================
  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Condition: CreateVPC
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnetCIDR2
      AvailabilityZone:
        Fn::If:
          - UseSpecificAZ2
          - !Ref AvailabilityZone2
          - !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${NPAPublisherGroupName}-PublicSubnet2'
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Condition: CreateVPC
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnetCIDR2
      AvailabilityZone:
        Fn::If:
          - UseSpecificAZ2
          - !Ref AvailabilityZone2
          - !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${NPAPublisherGroupName}-PrivateSubnet2'
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  NATGatewayEIP2:
    Type: AWS::EC2::EIP
    Condition: CreateVPC
    DependsOn: AttachGateway
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${NPAPublisherGroupName}-NAT-EIP2'
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  NATGateway2:
    Type: AWS::EC2::NatGateway
    Condition: CreateVPC
    Properties:
      AllocationId: !GetAtt NATGatewayEIP2.AllocationId
      SubnetId: !Ref PublicSubnet2
      Tags:
        - Key: Name
          Value: !Sub '${NPAPublisherGroupName}-NAT2'
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  PublicSubnetRouteTableAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateVPC
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    Condition: CreateVPC
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${NPAPublisherGroupName}-PrivateRT2'
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  PrivateRoute2:
    Type: AWS::EC2::Route
    Condition: CreateVPC
    Properties:
      RouteTableId: !Ref PrivateRouteTable2
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NATGateway2

  PrivateSubnetRouteTableAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateVPC
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable2

  # ==============================================================
  # Secrets Manager
  # ==============================================================
  APISecret:
    Type: 'AWS::SecretsManager::Secret'
    Condition: ToProvisionNewAPIToken
    Properties:
      Description: Netskope API secret token V2
      SecretString: !Sub '{"token":"${NetskopeAPIToken}"}'
      Tags:
        - Key: Name
          Value: NetskopeAPIToken
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  # ==============================================================
  # IAM Roles
  # ==============================================================
  NPAPublisherInstanceRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: !Sub '${NPAPublisherGroupName}-InstanceRole-${AWS::Region}'
      Tags:
        - Key: Name
          Value: !Sub '${NPAPublisherGroupName}-InstanceRole'
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: '/'
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'

  NPAPublisherInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: "/"
      InstanceProfileName: !Sub '${NPAPublisherGroupName}-InstanceProfile-${AWS::Region}'
      Roles:
        - !Ref NPAPublisherInstanceRole

  NPACallNetskopeAPIv2LFRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: !Sub '${NPAPublisherGroupName}-LFRole-${AWS::Region}'
      Tags:
        - Key: Name
          Value: !Sub '${NPAPublisherGroupName}-LFRole'
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: '/'
      Policies:
        - PolicyName: !Sub '${NPAPublisherGroupName}-LFPolicy-${AWS::Region}'
          PolicyDocument:
            Statement:
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - "logs:CreateLogGroup"
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Resource:
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${NPAPublisherGroupName}-RegistrationHandler:*'
              - Sid: SecretsManagerAccess
                Effect: Allow
                Action:
                  - 'secretsmanager:GetSecretValue'
                  - 'secretsmanager:DescribeSecret'
                Resource:
                  'Fn::If':
                    - ToProvisionNewAPIToken
                    - !Ref APISecret
                    - !Ref ExistingNetskopeAPITokenARN
              - Sid: SSMSendCommandToPublisherInstances
                Effect: Allow
                Action:
                  - 'ssm:SendCommand'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:instance/*'
                Condition:
                  StringLike:
                    'ssm:resourceTag/Name':
                      - !Ref NPAPublisherGroupName
                      - !Sub '${NPAPublisherGroupName}-*'
              - Sid: SSMSendCommandToDocuments
                Effect: Allow
                Action:
                  - 'ssm:SendCommand'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:*:*:document/AWS-RunShellScript'
                  - !Sub 'arn:${AWS::Partition}:ssm:*:*:document/AWS-*'
              # NOTE: ssm:GetCommandInvocation requires wildcard resource
              # Command IDs are dynamically generated at runtime and cannot be predicted
              # AWS SSM API does not support resource-level permissions for this action
              - Sid: SSMGetCommandInvocation
                Effect: Allow
                Action:
                  - 'ssm:GetCommandInvocation'
                Resource: '*'
              # NOTE: ssm:DescribeInstanceInformation requires wildcard resource
              # AWS SSM API does not support resource-level permissions for this action
              - Sid: SSMDescribeInstances
                Effect: Allow
                Action:
                  - 'ssm:DescribeInstanceInformation'
                Resource: '*'
              # NOTE: ec2:DescribeInstances requires wildcard resource
              # AWS EC2 API does not support resource-level permissions for describe actions
              - Sid: EC2DescribeInstances
                Effect: Allow
                Action:
                  - 'ec2:DescribeInstances'
                Resource: '*'
              - Sid: EC2StopPublisherInstances
                Effect: Allow
                Action:
                  - 'ec2:StopInstances'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:instance/*'
                Condition:
                  StringLike:
                    'ec2:ResourceTag/Name':
                      - !Ref NPAPublisherGroupName
                      - !Sub '${NPAPublisherGroupName}-*'

  # ==============================================================
  # Security Group
  # ==============================================================
  NPAPublisherSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${NPAPublisherGroupName}-SecurityGroup'
      GroupDescription: "Security group with only egress rule"
      VpcId:
        Fn::If:
          - CreateVPC
          - !Ref VPC
          - !Ref ExistingVPC
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 0
          ToPort: 65535
          CidrIp: 0.0.0.0/0
        - IpProtocol: udp
          FromPort: 0
          ToPort: 65535
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${NPAPublisherGroupName}-SecurityGroup'
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  # ==============================================================
  # EC2 Instance
  # ==============================================================
  NPAPublisherInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref NPAPublisherAMIId
      InstanceType: !Ref NPAPublisherInstanceType
      KeyName: !Ref NPAPublisherKey
      IamInstanceProfile: !Ref NPAPublisherInstanceProfile
      SecurityGroupIds:
        - !Ref NPAPublisherSecurityGroup
      SubnetId:
        Fn::If:
          - CreateVPC
          - !Ref PrivateSubnet
          - !Ref ExistingPrivateSubnet
      Monitoring: true
      Tags:
        - Key: Name
          Value: !Ref NPAPublisherGroupName
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  NPAPublisherInstance2:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref NPAPublisherAMIId
      InstanceType: !Ref NPAPublisherInstanceType
      KeyName: !Ref NPAPublisherKey
      IamInstanceProfile: !Ref NPAPublisherInstanceProfile
      SecurityGroupIds:
        - !Ref NPAPublisherSecurityGroup
      SubnetId:
        Fn::If:
          - CreateVPC
          - !Ref PrivateSubnet2
          - !Ref ExistingPrivateSubnet2
      Monitoring: true
      Tags:
        - Key: Name
          Value: !Sub '${NPAPublisherGroupName}-2'
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  # ==============================================================
  # Lambda Function
  # ==============================================================
  NPAPublisherRegistrationFunction:
    Type: 'AWS::Lambda::Function'
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Lambda functions require internet access to call Netskope REST API v2"
          - id: W92
            reason: "Concurrent execution limits not required for this use case"
          - id: W58
            reason: "Function has CloudWatch Logs permissions in IAM role"
    Properties:
      FunctionName: !Sub "${NPAPublisherGroupName}-RegistrationHandler"
      Description: >-
        CloudFormation custom resource handler for NPA publisher registration via SSM
      Handler: 'lambda_function.lambda_handler'
      Role: !GetAtt NPACallNetskopeAPIv2LFRole.Arn
      Code:
        S3Bucket:
          Fn::If:
            - UseCustomLambdaBucket
            - !Ref LambdaS3Bucket
            - !Sub
              - '${Bucket}-${AWS::Region}'
              - Bucket: !FindInMap [SourceCode, General, S3Bucket]
        S3Key: !Ref LambdaS3Key
      Environment:
        Variables:
          tenant_fqdn: !Ref NetskopeTenantFQDN
          api_token:
            'Fn::If':
              - ToProvisionNewAPIToken
              - !Ref APISecret
              - !Ref ExistingNetskopeAPITokenARN
          LOGLEVEL: 'INFO'
          EC2_READY_TIMEOUT: '120'
          SSM_READY_TIMEOUT: '240'
          COMMAND_TIMEOUT: '300'
          PUBLISHER_DISCONNECT_TIMEOUT: '120'
      Runtime: python3.12
      MemorySize: 128
      Timeout: 600
      Tags:
        - Key: Type
          Value: NPAPublisherManagement
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  # ==============================================================
  # Custom Resource for Publisher Registration
  # ==============================================================
  NPAPublisherRegistration:
    Type: Custom::NPAPublisher
    DependsOn: NPAPublisherInstance
    Properties:
      ServiceToken: !GetAtt NPAPublisherRegistrationFunction.Arn
      InstanceId: !Ref NPAPublisherInstance
      PublisherGroupName: !Ref NPAPublisherGroupName
      AccountId: !Ref AWS::AccountId

  NPAPublisherRegistration2:
    Type: Custom::NPAPublisher
    DependsOn: NPAPublisherInstance2
    Properties:
      ServiceToken: !GetAtt NPAPublisherRegistrationFunction.Arn
      InstanceId: !Ref NPAPublisherInstance2
      PublisherGroupName: !Ref NPAPublisherGroupName
      AccountId: !Ref AWS::AccountId

Outputs:
  PublisherInstanceId:
    Description: EC2 Instance ID of the NPA Publisher
    Value: !Ref NPAPublisherInstance
    Export:
      Name: !Sub '${AWS::StackName}-InstanceId'

  PublisherPrivateIP:
    Description: Private IP address of the NPA Publisher
    Value: !GetAtt NPAPublisherInstance.PrivateIp
    Export:
      Name: !Sub '${AWS::StackName}-PrivateIP'

  PublisherSecurityGroup:
    Description: Security Group ID for the NPA Publisher
    Value: !Ref NPAPublisherSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-SecurityGroup'

  LambdaFunctionArn:
    Description: ARN of the Lambda function managing publisher registration
    Value: !GetAtt NPAPublisherRegistrationFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-LambdaArn'

  LambdaFunctionName:
    Description: Name of the Lambda function (for CloudWatch Logs)
    Value: !Ref NPAPublisherRegistrationFunction
    Export:
      Name: !Sub '${AWS::StackName}-LambdaName'

  PublisherGroupName:
    Description: NPA Publisher Group Name
    Value: !Ref NPAPublisherGroupName
    Export:
      Name: !Sub '${AWS::StackName}-GroupName'

  VPCId:
    Condition: CreateVPC
    Description: VPC ID (created by this stack)
    Value: !Ref VPC
    Export:
      Name: !Sub '${AWS::StackName}-VPC'

  PublicSubnetId:
    Condition: CreateVPC
    Description: Public Subnet ID (created by this stack)
    Value: !Ref PublicSubnet
    Export:
      Name: !Sub '${AWS::StackName}-PublicSubnet'

  PrivateSubnetId:
    Condition: CreateVPC
    Description: Private Subnet ID (created by this stack)
    Value: !Ref PrivateSubnet
    Export:
      Name: !Sub '${AWS::StackName}-PrivateSubnet'

  NATGatewayId:
    Condition: CreateVPC
    Description: NAT Gateway ID (created by this stack)
    Value: !Ref NATGateway
    Export:
      Name: !Sub '${AWS::StackName}-NATGateway'

  PublisherInstanceId2:
    Description: EC2 Instance ID of the second NPA Publisher
    Value: !Ref NPAPublisherInstance2
    Export:
      Name: !Sub '${AWS::StackName}-InstanceId2'

  PublisherPrivateIP2:
    Description: Private IP address of the second NPA Publisher
    Value: !GetAtt NPAPublisherInstance2.PrivateIp
    Export:
      Name: !Sub '${AWS::StackName}-PrivateIP2'

  PublicSubnetId2:
    Condition: CreateVPC
    Description: Second Public Subnet ID (created by this stack)
    Value: !Ref PublicSubnet2
    Export:
      Name: !Sub '${AWS::StackName}-PublicSubnet2'

  PrivateSubnetId2:
    Condition: CreateVPC
    Description: Second Private Subnet ID (created by this stack)
    Value: !Ref PrivateSubnet2
    Export:
      Name: !Sub '${AWS::StackName}-PrivateSubnet2'

  NATGatewayId2:
    Condition: CreateVPC
    Description: Second NAT Gateway ID (created by this stack)
    Value: !Ref NATGateway2
    Export:
      Name: !Sub '${AWS::StackName}-NATGateway2'
