---
AWSTemplateFormatVersion: 2010-09-09
Description: "NPA Publisher Dual Instance Multi-AZ (No Auto Scaling) 2.0 - Deploys two NPA Publishers across two availability zones for redundancy"

Metadata:
  cfn-lint:
    config:
      ignore_checks:
        - W3002
        - W2001
        - E3030
        - E3002  # MetadataOptions is valid on AWS::EC2::Instance but not in cfn-lint's spec
        - E3510  # ExistingNetskopeAPITokenParam default is empty; only used when ProvisionNewAPIToken=no
  AWS::CloudFormation::Interface:
    ParameterGroups:
      -
        Label:
          default: "Netskope tenant info"
        Parameters:
          - NetskopeTenantFQDN
          - ProvisionNewAPIToken
          - ExistingNetskopeAPITokenParam
          - NetskopeAPIToken
      -
        Label:
          default: "VPC Configuration"
        Parameters:
          - CreateNewVPC
          - VPCCIDR
          - PublicSubnetCIDR
          - PrivateSubnetCIDR
          - AvailabilityZone
          - PublicSubnetCIDR2
          - PrivateSubnetCIDR2
          - AvailabilityZone2
          - ExistingVPC
          - ExistingPrivateSubnet
          - ExistingPrivateSubnet2
      -
        Label:
          default: "Netskope NPA Publisher info"
        Parameters:
          - NPAPublisherGroupName
          - AppAssociations
          - NPAPublisherAMIId
          - NPAPublisherKey
          - NPAPublisherInstanceType
          - EnableCWMonitoring
          - AdditionalPolicyArn1
          - AdditionalPolicyArn2
          - AdditionalPolicyArn3
      -
        Label:
          default: "Lambda deployment configuration"
        Parameters:
          - LambdaS3Bucket
          - LambdaS3Key
      -
        Label:
          default: "Cost allocation and tagging"
        Parameters:
          - CostCenterTag
          - ProjectTag
          - EnvironmentTag
    ParameterLabels:
      NetskopeTenantFQDN:
        default: Netskope tenant FQDN, for example mytenant.goskope.com
      ProvisionNewAPIToken:
        default: Choose if you'd like to create a new SSM parameter for Netskope API token or use an existing one
      ExistingNetskopeAPITokenParam:
        default: Existing SSM parameter name with leading slash (e.g., /netskope/api-token)
      NetskopeAPIToken:
        default: Netskope API v2 token if you're creating a new SSM parameter
      VPC:
        default: VPC id where you'd like your NPA publisher to be deployed
      NPAPublisherSubnet:
        default: Select Private Subnet with internet connectivity via NAT Gateway
      NPAPublisherGroupName:
        default: NPA Publisher Group Name
      AppAssociations:
        default: "Private apps to associate with publishers (None, All, tag:<names>, or comma-separated app names)"
      NPAPublisherAMIId:
        default: NPA publisher AMI id
      NPAPublisherKey:
        default: Access key for the EC2 instance
      NPAPublisherInstanceType:
        default: EC2 instance type for the publisher
      CostCenterTag:
        default: Cost center for billing and resource allocation
      ProjectTag:
        default: Project name for resource tracking and reporting
      EnvironmentTag:
        default: Environment type (Production, Staging, Development, Test)
      EnableCWMonitoring:
        default: Enable CloudWatch agent for memory and disk metrics (~$2.40/month per instance)
      LambdaS3Bucket:
        default: S3 bucket name for Lambda package (bucket name only, not s3:// URI)
      LambdaS3Key:
        default: S3 key/path for Lambda package (e.g., npa-publisher-lambda.zip)

Parameters:
  NPAPublisherGroupName:
    Description: 'The NPA publisher group name used for naming publishers and resources'
    Type: String
    MinLength: 3
    MaxLength: 64
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9-]*$'
    ConstraintDescription: 'Must start with a letter and contain only alphanumeric characters and hyphens'

  AppAssociations:
    Description: 'Private apps to associate with publishers. "None" to skip, "All" for all apps, "tag:name1,name2" for tag-based matching (OR, case-insensitive), or a comma-separated list of app names'
    Type: String
    Default: 'None'

  NPAPublisherAMIId:
    Description: 'NPA publisher AMI id'
    Type: AWS::EC2::Image::Id

  NPAPublisherKey:
    Description: 'NPA publisher KeyPair Name'
    Type: AWS::EC2::KeyPair::KeyName

  CreateNewVPC:
    Description: 'Create new VPC with NAT Gateway, or use existing VPC?'
    Type: String
    Default: 'no'
    AllowedValues:
      - 'yes'
      - 'no'

  VPCCIDR:
    Description: 'CIDR block for VPC. Used when creating new VPC, or specify existing VPC CIDR for security group rules.'
    Type: String
    Default: '10.0.0.0/16'
    AllowedPattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2]))$'

  PublicSubnetCIDR:
    Description: 'CIDR block for public subnet (only used if CreateNewVPC=yes)'
    Type: String
    Default: '10.0.1.0/24'
    AllowedPattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2]))$'

  PrivateSubnetCIDR:
    Description: 'CIDR block for private subnet (only used if CreateNewVPC=yes)'
    Type: String
    Default: '10.0.2.0/24'
    AllowedPattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2]))$'

  AvailabilityZone:
    Description: 'Availability Zone for subnets (only used if CreateNewVPC=yes, leave empty for auto-select)'
    Type: String
    Default: ''

  ExistingVPC:
    Description: 'Existing VPC ID (only used if CreateNewVPC=no)'
    Type: String
    Default: ''

  ExistingPrivateSubnet:
    Description: 'Existing private subnet with NAT Gateway in first AZ (only used if CreateNewVPC=no)'
    Type: String
    Default: ''

  AvailabilityZone2:
    Description: 'Second Availability Zone for subnets (only used if CreateNewVPC=yes, leave empty for auto-select)'
    Type: String
    Default: ''

  PublicSubnetCIDR2:
    Description: 'CIDR block for second public subnet (only used if CreateNewVPC=yes)'
    Type: String
    Default: '10.0.3.0/24'
    AllowedPattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2]))$'

  PrivateSubnetCIDR2:
    Description: 'CIDR block for second private subnet (only used if CreateNewVPC=yes)'
    Type: String
    Default: '10.0.4.0/24'
    AllowedPattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2]))$'

  ExistingPrivateSubnet2:
    Description: 'Existing private subnet with NAT Gateway in second AZ (only used if CreateNewVPC=no)'
    Type: String
    Default: ''

  NPAPublisherInstanceType:
    Description: 'EC2 instance type for NPA publisher'
    Type: String
    Default: 't3.large'
    AllowedValues:
      - 't3.medium'
      - 't3.large'
      - 't3.xlarge'
      - 't3.2xlarge'
      - 'm5.large'
      - 'm5.xlarge'
      - 'm5.2xlarge'

  NetskopeTenantFQDN:
    Description: 'Enter your Netskope tenant FQDN here (mytenant.goskope.com)'
    Type: String
    AllowedPattern: '^[a-z0-9][a-z0-9-]*\.goskope\.com$'
    ConstraintDescription: 'Must be a valid Netskope tenant FQDN ending with .goskope.com'

  ProvisionNewAPIToken:
    Default: 'yes'
    Description: 'Provision new SSM parameter for Netskope API v2 token?'
    AllowedValues:
      - 'yes'
      - 'no'
    Type: 'String'

  NetskopeAPIToken:
    NoEcho: true
    Default: ""
    Description: 'If a new SSM parameter is being created, enter the Netskope API v2 token here'
    Type: String

  ExistingNetskopeAPITokenParam:
    Description: 'If using an existing SSM parameter, enter the full parameter name with leading slash (e.g., /netskope/api-token). For production, use a SecureString parameter created via CLI.'
    Type: 'String'
    Default: ''

  CostCenterTag:
    Description: 'Cost center for resource allocation and billing'
    Type: String
    MinLength: 1
    MaxLength: 255
    Default: 'IT-Operations'

  ProjectTag:
    Description: 'Project identifier for resource tracking'
    Type: String
    MinLength: 1
    MaxLength: 255
    Default: 'NPA-Publisher-SingleInstance'

  EnvironmentTag:
    Description: 'Environment type (e.g., Production, Development, Staging)'
    Type: String
    Default: 'Production'
    AllowedValues:
      - 'Production'
      - 'Staging'
      - 'Development'
      - 'Test'

  EnableCWMonitoring:
    Description: 'Install CloudWatch agent for advanced metrics (memory, disk usage). Adds ~$2.40/month per instance for custom metrics.'
    Type: String
    Default: 'no'
    AllowedValues:
      - 'yes'
      - 'no'

  LambdaS3Bucket:
    Description: 'S3 bucket name containing Lambda deployment package (bucket name only, not s3:// URI). Leave empty to use default Netskope bucket'
    Type: String
    Default: ''

  LambdaS3Key:
    Description: 'S3 key for Lambda deployment package (e.g., npa-publisher-lambda.zip or path/to/lambda.zip)'
    Type: String
    Default: 'npa-publisher-lambda.zip'

  # NOTE: CloudFormation has no list-merge intrinsic function, so additional managed policies
  # are handled as individual optional parameters (a CloudFormation convention, not a best
  # practice — CDK/Terraform handle this more elegantly). Supports up to 3 extra policies.
  AdditionalPolicyArn1:
    Description: '(Optional) Additional IAM managed policy ARN to attach to the publisher instance role (e.g., for custom SSM documents or S3 access)'
    Type: String
    Default: ''

  AdditionalPolicyArn2:
    Description: '(Optional) Second additional IAM managed policy ARN to attach to the publisher instance role'
    Type: String
    Default: ''

  AdditionalPolicyArn3:
    Description: '(Optional) Third additional IAM managed policy ARN to attach to the publisher instance role'
    Type: String
    Default: ''

Conditions:
  ToProvisionNewAPIToken: !Equals
    - !Ref ProvisionNewAPIToken
    - 'yes'
  UseCustomLambdaBucket: !Not
    - !Equals
      - !Ref LambdaS3Bucket
      - ''
  CreateVPC: !Equals
    - !Ref CreateNewVPC
    - 'yes'
  UseExistingVPC: !Equals
    - !Ref CreateNewVPC
    - 'no'
  UseSpecificAZ: !Not
    - !Equals
      - !Ref AvailabilityZone
      - ''
  UseSpecificAZ2: !Not
    - !Equals
      - !Ref AvailabilityZone2
      - ''
  EnableCloudWatchMonitoring: !Equals
    - !Ref EnableCWMonitoring
    - 'yes'
  HasAdditionalPolicy1: !Not [!Equals [!Ref AdditionalPolicyArn1, '']]
  HasAdditionalPolicy2: !Not [!Equals [!Ref AdditionalPolicyArn2, '']]
  HasAdditionalPolicy3: !Not [!Equals [!Ref AdditionalPolicyArn3, '']]

Mappings:
  SourceCode:
    General:
      S3Bucket: 'netskope-marketplace'
      S3Prefix: "NPAPublisherAutoscalling"

Resources:
  # ================================================================
  # NPA PUBLISHER INSTANCES
  # ================================================================
  #
  # Each publisher requires two resources:
  #   1. An EC2 Instance     - the publisher VM
  #   2. A Custom Resource   - registers the publisher with Netskope
  #
  # SCALING UP — To add a publisher:
  #   1. Copy an entire "Publisher N" block below (Instance + Registration)
  #   2. Change all resource names: increment the suffix number
  #      e.g. NPAPublisherInstance2 -> NPAPublisherInstance3
  #           NPAPublisherRegistration2 -> NPAPublisherRegistration3
  #   3. Update DependsOn in the Registration to include BOTH:
  #      - The new Instance name (e.g. NPAPublisherInstance3)
  #      - The PREVIOUS Registration (e.g. NPAPublisherRegistration2)
  #      This serializes registrations to prevent race conditions when
  #      multiple publishers write to the same app definitions.
  #   4. Set SubnetId to the desired subnet:
  #      - New VPC:      use !Ref PrivateSubnet or !Ref PrivateSubnet2
  #      - Existing VPC: use !Ref ExistingPrivateSubnet or ExistingPrivateSubnet2
  #      For a third AZ, add a new subnet parameter and reference it here
  #   5. Update the Name tag to a unique value (e.g. ${NPAPublisherGroupName}-3)
  #   6. Add matching Outputs at the bottom of the template
  #   7. Run: aws cloudformation update-stack ...
  #
  # SCALING DOWN — To remove a publisher:
  #   1. Delete the publisher's Instance + Registration block
  #   2. Update the DependsOn chain if removing a publisher in the middle
  #      (e.g. if removing Publisher 2 of 3, point Publisher 3's Registration
  #      DependsOn to Publisher 1's Registration instead)
  #   3. Delete the matching Outputs
  #   4. Run: aws cloudformation update-stack ...
  #      CloudFormation will trigger the Custom Resource DELETE, which
  #      deregisters the publisher from Netskope automatically.
  #
  # ================================================================

  # ---------------------------------------------------------------
  # Publisher 1 — AZ1 (PrivateSubnet / ExistingPrivateSubnet)
  # ---------------------------------------------------------------
  NPAPublisherInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref NPAPublisherAMIId
      InstanceType: !Ref NPAPublisherInstanceType
      KeyName: !Ref NPAPublisherKey
      IamInstanceProfile: !Ref NPAPublisherInstanceProfile
      SecurityGroupIds:
        - !Ref NPAPublisherSecurityGroup
      SubnetId:
        Fn::If:
          - CreateVPC
          - !Ref PrivateSubnet
          - !Ref ExistingPrivateSubnet
      Monitoring: true
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
        HttpPutResponseHopLimit: 2
      UserData: !Ref AWS::NoValue
      Tags:
        - Key: Name
          Value: !Ref NPAPublisherGroupName
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag
        - Key: aws-apn-id
          Value: 2477fb49-b2ca-409e-9b2b-87322e6008c2

  NPAPublisherRegistration:
    Type: Custom::NPAPublisher
    DependsOn: NPAPublisherInstance
    Properties:
      ServiceToken: !GetAtt NPAPublisherRegistrationFunction.Arn
      InstanceId: !Ref NPAPublisherInstance
      PublisherNamePrefix: !Ref NPAPublisherGroupName
      AppAssociations: !Ref AppAssociations
      AccountId: !Ref AWS::AccountId
      CloudWatchConfigParam:
        !If
          - EnableCloudWatchMonitoring
          - !Sub '/cloudwatch-config/${AWS::StackName}/${NPAPublisherGroupName}'
          - !Ref AWS::NoValue

  # ---------------------------------------------------------------
  # Publisher 2 — AZ2 (PrivateSubnet2 / ExistingPrivateSubnet2)
  # ---------------------------------------------------------------
  NPAPublisherInstance2:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref NPAPublisherAMIId
      InstanceType: !Ref NPAPublisherInstanceType
      KeyName: !Ref NPAPublisherKey
      IamInstanceProfile: !Ref NPAPublisherInstanceProfile
      SecurityGroupIds:
        - !Ref NPAPublisherSecurityGroup
      SubnetId:
        Fn::If:
          - CreateVPC
          - !Ref PrivateSubnet2
          - !Ref ExistingPrivateSubnet2
      Monitoring: true
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
        HttpPutResponseHopLimit: 2
      UserData: !Ref AWS::NoValue
      Tags:
        - Key: Name
          Value: !Sub '${NPAPublisherGroupName}-2'
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag
        - Key: aws-apn-id
          Value: 2477fb49-b2ca-409e-9b2b-87322e6008c2

  NPAPublisherRegistration2:
    Type: Custom::NPAPublisher
    DependsOn:
      - NPAPublisherInstance2
      - NPAPublisherRegistration
    Properties:
      ServiceToken: !GetAtt NPAPublisherRegistrationFunction.Arn
      InstanceId: !Ref NPAPublisherInstance2
      PublisherNamePrefix: !Ref NPAPublisherGroupName
      AppAssociations: !Ref AppAssociations
      AccountId: !Ref AWS::AccountId
      CloudWatchConfigParam:
        !If
          - EnableCloudWatchMonitoring
          - !Sub '/cloudwatch-config/${AWS::StackName}/${NPAPublisherGroupName}'
          - !Ref AWS::NoValue

  # ==============================================================
  # SHARED INFRASTRUCTURE (no changes needed for scaling)
  # ==============================================================

  # ==============================================================
  # VPC Resources (Conditional - only created if CreateNewVPC=yes)
  # ==============================================================
  VPC:
    Type: AWS::EC2::VPC
    Condition: CreateVPC
    Properties:
      CidrBlock: !Ref VPCCIDR
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${NPAPublisherGroupName}-VPC'
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: CreateVPC
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${NPAPublisherGroupName}-IGW'
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: CreateVPC
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Condition: CreateVPC
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnetCIDR
      AvailabilityZone:
        Fn::If:
          - UseSpecificAZ
          - !Ref AvailabilityZone
          - !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${NPAPublisherGroupName}-PublicSubnet'
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Condition: CreateVPC
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnetCIDR
      AvailabilityZone:
        Fn::If:
          - UseSpecificAZ
          - !Ref AvailabilityZone
          - !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${NPAPublisherGroupName}-PrivateSubnet'
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  NATGatewayEIP:
    Type: AWS::EC2::EIP
    Condition: CreateVPC
    DependsOn: AttachGateway
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${NPAPublisherGroupName}-NAT-EIP'
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  NATGateway:
    Type: AWS::EC2::NatGateway
    Condition: CreateVPC
    Properties:
      AllocationId: !GetAtt NATGatewayEIP.AllocationId
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: !Sub '${NPAPublisherGroupName}-NAT'
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateVPC
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${NPAPublisherGroupName}-PublicRT'
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  PublicRoute:
    Type: AWS::EC2::Route
    Condition: CreateVPC
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateVPC
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateVPC
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${NPAPublisherGroupName}-PrivateRT'
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  PrivateRoute:
    Type: AWS::EC2::Route
    Condition: CreateVPC
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NATGateway

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateVPC
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  # ==============================================================
  # Second AZ Resources (for two-instance deployment)
  # ==============================================================
  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Condition: CreateVPC
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnetCIDR2
      AvailabilityZone:
        Fn::If:
          - UseSpecificAZ2
          - !Ref AvailabilityZone2
          - !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${NPAPublisherGroupName}-PublicSubnet2'
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Condition: CreateVPC
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnetCIDR2
      AvailabilityZone:
        Fn::If:
          - UseSpecificAZ2
          - !Ref AvailabilityZone2
          - !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${NPAPublisherGroupName}-PrivateSubnet2'
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  NATGatewayEIP2:
    Type: AWS::EC2::EIP
    Condition: CreateVPC
    DependsOn: AttachGateway
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${NPAPublisherGroupName}-NAT-EIP2'
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  NATGateway2:
    Type: AWS::EC2::NatGateway
    Condition: CreateVPC
    Properties:
      AllocationId: !GetAtt NATGatewayEIP2.AllocationId
      SubnetId: !Ref PublicSubnet2
      Tags:
        - Key: Name
          Value: !Sub '${NPAPublisherGroupName}-NAT2'
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  PublicSubnetRouteTableAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateVPC
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    Condition: CreateVPC
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${NPAPublisherGroupName}-PrivateRT2'
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  PrivateRoute2:
    Type: AWS::EC2::Route
    Condition: CreateVPC
    Properties:
      RouteTableId: !Ref PrivateRouteTable2
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NATGateway2

  PrivateSubnetRouteTableAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateVPC
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable2

  # ==============================================================
  # SSM Parameter Store (API Token)
  # ==============================================================
  # NOTE: CloudFormation does not support creating SecureString parameters.
  # This creates a String parameter. For production, pre-create the parameter
  # as SecureString via CLI and use ProvisionNewAPIToken=no:
  #   aws ssm put-parameter --name /netskope/api-token --type SecureString --value "YOUR_TOKEN"
  APISecret:
    Type: 'AWS::SSM::Parameter'
    Condition: ToProvisionNewAPIToken
    Properties:
      Name: !Sub '${AWS::StackName}-netskope-api-token'
      Type: String
      Description: Netskope API v2 token (use SecureString for production - see comments above)
      Value: !Ref NetskopeAPIToken
      Tags:
        CostCenter: !Ref CostCenterTag
        Project: !Ref ProjectTag
        Environment: !Ref EnvironmentTag

  # ==============================================================
  # CloudWatch Agent Configuration
  # ==============================================================
  CloudWatchAgentConfig:
    Type: AWS::SSM::Parameter
    Condition: EnableCloudWatchMonitoring
    Properties:
      Name: !Sub '/cloudwatch-config/${AWS::StackName}/${NPAPublisherGroupName}'
      Type: String
      Description: CloudWatch agent configuration for NPA Publisher monitoring
      Value: !Sub |
        {
          "agent": {
            "metrics_collection_interval": 60,
            "run_as_user": "cwagent"
          },
          "metrics": {
            "namespace": "NPA/Publisher",
            "append_dimensions": {
              "InstanceId": "${!aws:InstanceId}",
              "PublisherGroup": "${NPAPublisherGroupName}"
            },
            "metrics_collected": {
              "cpu": {
                "measurement": [
                  {"name": "cpu_usage_idle", "rename": "CPU_IDLE", "unit": "Percent"},
                  {"name": "cpu_usage_iowait", "rename": "CPU_IOWAIT", "unit": "Percent"}
                ],
                "metrics_collection_interval": 60,
                "resources": ["*"],
                "totalcpu": false
              },
              "disk": {
                "measurement": [
                  {"name": "used_percent", "rename": "DISK_USED", "unit": "Percent"}
                ],
                "metrics_collection_interval": 60,
                "resources": ["*"]
              },
              "mem": {
                "measurement": [
                  {"name": "mem_used_percent", "rename": "MEMORY_USED", "unit": "Percent"}
                ],
                "metrics_collection_interval": 60
              },
              "swap": {
                "measurement": [
                  {"name": "swap_used_percent", "rename": "SWAP_USED", "unit": "Percent"}
                ],
                "metrics_collection_interval": 60
              }
            }
          }
        }
      Tags:
        CostCenter: !Ref CostCenterTag
        Project: !Ref ProjectTag
        Environment: !Ref EnvironmentTag

  # ==============================================================
  # IAM Roles
  # ==============================================================
  NPAPublisherInstanceRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: !Sub '${AWS::StackName}-${NPAPublisherGroupName}-InstanceRole-${AWS::Region}'
      Tags:
        - Key: Name
          Value: !Sub '${NPAPublisherGroupName}-InstanceRole'
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: '/'
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
        - !If
          - EnableCloudWatchMonitoring
          - !Sub 'arn:${AWS::Partition}:iam::aws:policy/CloudWatchAgentServerPolicy'
          - !Ref AWS::NoValue
        - !If [HasAdditionalPolicy1, !Ref AdditionalPolicyArn1, !Ref AWS::NoValue]
        - !If [HasAdditionalPolicy2, !Ref AdditionalPolicyArn2, !Ref AWS::NoValue]
        - !If [HasAdditionalPolicy3, !Ref AdditionalPolicyArn3, !Ref AWS::NoValue]
      Policies:
        - !If
          - EnableCloudWatchMonitoring
          - PolicyName: CloudWatchAgentConfig
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Sid: CloudWatchAgentSSMParameter
                  Effect: Allow
                  Action:
                    - 'ssm:GetParameter'
                  Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudwatch-config/${AWS::StackName}/${NPAPublisherGroupName}'
          - !Ref AWS::NoValue

  NPAPublisherInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: "/"
      InstanceProfileName: !Sub '${AWS::StackName}-${NPAPublisherGroupName}-InstanceProfile-${AWS::Region}'
      Roles:
        - !Ref NPAPublisherInstanceRole

  NPACallNetskopeAPIv2LFRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: !Sub '${AWS::StackName}-${NPAPublisherGroupName}-LFRole-${AWS::Region}'
      Tags:
        - Key: Name
          Value: !Sub '${NPAPublisherGroupName}-LFRole'
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: '/'
      Policies:
        - PolicyName: !Sub '${AWS::StackName}-${NPAPublisherGroupName}-LFPolicy-${AWS::Region}'
          PolicyDocument:
            Statement:
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - "logs:CreateLogGroup"
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Resource:
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-${NPAPublisherGroupName}-RegistrationHandler:*'
              - Sid: SSMParameterAccess
                Effect: Allow
                Action:
                  - 'ssm:GetParameter'
                Resource:
                  'Fn::If':
                    - ToProvisionNewAPIToken
                    - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${APISecret}'
                    # parameter${name} produces parameter/name when name starts with /
                    - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ExistingNetskopeAPITokenParam}'
              - !If
                - ToProvisionNewAPIToken
                - !Ref AWS::NoValue
                - Sid: KMSDecryptForSecureString
                  Effect: Allow
                  Action:
                    - 'kms:Decrypt'
                  Resource:
                    - !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/ssm'
                    - !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*'
                  Condition:
                    StringEquals:
                      'kms:ViaService': !Sub 'ssm.${AWS::Region}.amazonaws.com'
              - Sid: SSMSendCommandToPublisherInstances
                Effect: Allow
                Action:
                  - 'ssm:SendCommand'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:instance/*'
                Condition:
                  StringLike:
                    'ssm:resourceTag/Name':
                      - !Ref NPAPublisherGroupName
                      - !Sub '${NPAPublisherGroupName}-*'
              - Sid: SSMSendCommandToDocuments
                Effect: Allow
                Action:
                  - 'ssm:SendCommand'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:*:*:document/AWS-RunShellScript'
                  - !Sub 'arn:${AWS::Partition}:ssm:*:*:document/AWS-*'
                  - !Sub 'arn:${AWS::Partition}:ssm:*:*:document/AmazonCloudWatch-ManageAgent'
              # NOTE: ssm:GetCommandInvocation requires wildcard resource
              # Command IDs are dynamically generated at runtime and cannot be predicted
              # AWS SSM API does not support resource-level permissions for this action
              - Sid: SSMGetCommandInvocation
                Effect: Allow
                Action:
                  - 'ssm:GetCommandInvocation'
                Resource: '*'
              # NOTE: ssm:DescribeInstanceInformation requires wildcard resource
              # AWS SSM API does not support resource-level permissions for this action
              - Sid: SSMDescribeInstances
                Effect: Allow
                Action:
                  - 'ssm:DescribeInstanceInformation'
                Resource: '*'
              # NOTE: ec2:DescribeInstances requires wildcard resource
              # AWS EC2 API does not support resource-level permissions for describe actions
              - Sid: EC2DescribeInstances
                Effect: Allow
                Action:
                  - 'ec2:DescribeInstances'
                Resource: '*'
              - Sid: EC2StopPublisherInstances
                Effect: Allow
                Action:
                  - 'ec2:StopInstances'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:instance/*'
                Condition:
                  StringLike:
                    'ec2:ResourceTag/Name':
                      - !Ref NPAPublisherGroupName
                      - !Sub '${NPAPublisherGroupName}-*'

  # ==============================================================
  # VPC Endpoints for Systems Manager
  # ==============================================================
  VPCEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateVPC
    Properties:
      GroupName: !Sub '${AWS::StackName}-${NPAPublisherGroupName}-VPCEndpoint-SecurityGroup'
      GroupDescription: "Security group for Systems Manager VPC endpoints"
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref NPAPublisherSecurityGroup
          Description: "Allow HTTPS from NPA Publishers"
      Tags:
        - Key: Name
          Value: !Sub '${NPAPublisherGroupName}-VPCEndpoint-SecurityGroup'
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  SSMVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateVPC
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ssm'
      VpcId: !Ref VPC
      SubnetIds:
        - !Ref PrivateSubnet
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      PrivateDnsEnabled: true

  EC2MessagesVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateVPC
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ec2messages'
      VpcId: !Ref VPC
      SubnetIds:
        - !Ref PrivateSubnet
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      PrivateDnsEnabled: true

  SSMMessagesVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateVPC
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ssmmessages'
      VpcId: !Ref VPC
      SubnetIds:
        - !Ref PrivateSubnet
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      PrivateDnsEnabled: true

  # ==============================================================
  # Security Group
  # ==============================================================
  NPAPublisherSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${AWS::StackName}-${NPAPublisherGroupName}-SecurityGroup'
      GroupDescription: "Security group with restrictive egress rules for Netskope and Systems Manager"
      VpcId:
        Fn::If:
          - CreateVPC
          - !Ref VPC
          - !Ref ExistingVPC
      SecurityGroupEgress:
        # Allow all traffic within VPC (for private app connectivity)
        - IpProtocol: -1
          CidrIp: !Ref VPCCIDR
          Description: "Allow all traffic within VPC for private app access"
        # RFC1918 Private Address Ranges (for network segment discovery)
        # See: https://docs.netskope.com/en/configure-app-discovery-for-private-apps
        - IpProtocol: -1
          CidrIp: 10.0.0.0/8
          Description: "RFC1918 Class A - Network segment discovery"
        - IpProtocol: -1
          CidrIp: 172.16.0.0/12
          Description: "RFC1918 Class B - Network segment discovery"
        - IpProtocol: -1
          CidrIp: 192.168.0.0/16
          Description: "RFC1918 Class C - Network segment discovery"
        # Netskope NewEdge Data Center IP Ranges
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 8.36.116.0/24
          Description: "Netskope NewEdge DC"
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 8.39.144.0/24
          Description: "Netskope NewEdge DC"
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 31.186.239.0/24
          Description: "Netskope NewEdge DC"
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 163.116.128.0/17
          Description: "Netskope NewEdge DC"
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 162.10.0.0/17
          Description: "Netskope NewEdge DC"
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 18.116.0.0/16
          Description: "Netskope Registration endpoints us-east-2"
        # =====================================================================
        # TEMPORARY WORKAROUND: Allow all HTTPS egress
        # =====================================================================
        # ISSUE: Netskope NPA registration endpoints (ns-*.{region}.npa.goskope.com)
        #        are hosted on AWS infrastructure using undocumented IP ranges.
        #        Example: ns-26784.us-dfw3.npa.goskope.com -> 18.116.181.47
        #
        # DOCUMENTED RANGES (from https://docs.netskope.com/en/newedge-ip-ranges-for-allowlisting/):
        #   - 8.36.116.0/24, 8.39.144.0/24, 31.186.239.0/24
        #   - 163.116.128.0/17, 162.10.0.0/17
        #
        # DISCOVERED RANGES (not documented):
        #   - 18.116.0.0/16 (us-east-2)
        #   - Unknown ranges in other regions
        #
        # ACTION REQUIRED: Contact Netskope support to obtain complete IP range
        #                  list for all NPA registration endpoints across all regions.
        #
        # TODO: Replace this rule with specific IP ranges once obtained from Netskope
        # =====================================================================
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: "TEMPORARY: Allow all HTTPS - pending complete Netskope IP ranges"
        # Publisher auto-updates: *.ubuntu.com requires TCP/80
        # Source: Netskope docs - "Publisher Outbound Connectivity Requirements"
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: "Publisher auto-updates: *.ubuntu.com (TCP/80) per Netskope docs"
      Tags:
        - Key: Name
          Value: !Sub '${NPAPublisherGroupName}-SecurityGroup'
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  # VPC Endpoint Egress Rule (only when using new VPC with VPC endpoints)
  VPCEndpointEgressRule:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: CreateVPC
    Properties:
      GroupId: !Ref NPAPublisherSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationSecurityGroupId: !Ref VPCEndpointSecurityGroup
      Description: "AWS Systems Manager via VPC Endpoints"

  # ==============================================================
  # Lambda Function (shared by all publisher registrations)
  # ==============================================================
  NPAPublisherRegistrationFunction:
    Type: 'AWS::Lambda::Function'
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Lambda functions require internet access to call Netskope REST API v2"
          - id: W92
            reason: "Concurrent execution limits not required for this use case"
          - id: W58
            reason: "Function has CloudWatch Logs permissions in IAM role"
    Properties:
      FunctionName: !Sub "${AWS::StackName}-${NPAPublisherGroupName}-RegistrationHandler"
      Description: >-
        CloudFormation custom resource handler for NPA publisher registration via SSM
      Handler: 'lambda_function.lambda_handler'
      Role: !GetAtt NPACallNetskopeAPIv2LFRole.Arn
      Code:
        S3Bucket:
          Fn::If:
            - UseCustomLambdaBucket
            - !Ref LambdaS3Bucket
            - !Sub
              - '${Bucket}-${AWS::Region}'
              - Bucket: !FindInMap [SourceCode, General, S3Bucket]
        S3Key: !Ref LambdaS3Key
      Environment:
        Variables:
          tenant_fqdn: !Ref NetskopeTenantFQDN
          api_token:
            'Fn::If':
              - ToProvisionNewAPIToken
              - !Ref APISecret
              - !Ref ExistingNetskopeAPITokenParam
          LOGLEVEL: 'INFO'
          EC2_READY_TIMEOUT: '120'
          SSM_READY_TIMEOUT: '240'
          COMMAND_TIMEOUT: '300'
          PUBLISHER_DISCONNECT_TIMEOUT: '120'
      Runtime: python3.12
      MemorySize: 128
      Timeout: 600
      Tags:
        - Key: Type
          Value: NPAPublisherManagement
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

Outputs:
  # ==============================================================
  # Shared Infrastructure Outputs
  # ==============================================================
  PublisherSecurityGroup:
    Description: Security Group ID for the NPA Publisher
    Value: !Ref NPAPublisherSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-SecurityGroup'

  LambdaFunctionArn:
    Description: ARN of the Lambda function managing publisher registration
    Value: !GetAtt NPAPublisherRegistrationFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-LambdaArn'

  LambdaFunctionName:
    Description: Name of the Lambda function (for CloudWatch Logs)
    Value: !Ref NPAPublisherRegistrationFunction
    Export:
      Name: !Sub '${AWS::StackName}-LambdaName'

  PublisherGroupName:
    Description: NPA Publisher Group Name
    Value: !Ref NPAPublisherGroupName
    Export:
      Name: !Sub '${AWS::StackName}-GroupName'

  VPCId:
    Condition: CreateVPC
    Description: VPC ID (created by this stack)
    Value: !Ref VPC
    Export:
      Name: !Sub '${AWS::StackName}-VPC'

  PublicSubnetId:
    Condition: CreateVPC
    Description: Public Subnet ID (created by this stack)
    Value: !Ref PublicSubnet
    Export:
      Name: !Sub '${AWS::StackName}-PublicSubnet'

  PrivateSubnetId:
    Condition: CreateVPC
    Description: Private Subnet ID (created by this stack)
    Value: !Ref PrivateSubnet
    Export:
      Name: !Sub '${AWS::StackName}-PrivateSubnet'

  NATGatewayId:
    Condition: CreateVPC
    Description: NAT Gateway ID (created by this stack)
    Value: !Ref NATGateway
    Export:
      Name: !Sub '${AWS::StackName}-NATGateway'

  PublicSubnetId2:
    Condition: CreateVPC
    Description: Second Public Subnet ID (created by this stack)
    Value: !Ref PublicSubnet2
    Export:
      Name: !Sub '${AWS::StackName}-PublicSubnet2'

  PrivateSubnetId2:
    Condition: CreateVPC
    Description: Second Private Subnet ID (created by this stack)
    Value: !Ref PrivateSubnet2
    Export:
      Name: !Sub '${AWS::StackName}-PrivateSubnet2'

  NATGatewayId2:
    Condition: CreateVPC
    Description: Second NAT Gateway ID (created by this stack)
    Value: !Ref NATGateway2
    Export:
      Name: !Sub '${AWS::StackName}-NATGateway2'

  # ==============================================================
  # Publisher Outputs
  # ==============================================================
  # When adding/removing publishers, add/remove matching outputs here.

  # Publisher 1
  PublisherInstanceId:
    Description: EC2 Instance ID of NPA Publisher 1
    Value: !Ref NPAPublisherInstance
    Export:
      Name: !Sub '${AWS::StackName}-InstanceId'

  PublisherPrivateIP:
    Description: Private IP address of NPA Publisher 1
    Value: !GetAtt NPAPublisherInstance.PrivateIp
    Export:
      Name: !Sub '${AWS::StackName}-PrivateIP'

  # Publisher 2
  PublisherInstanceId2:
    Description: EC2 Instance ID of NPA Publisher 2
    Value: !Ref NPAPublisherInstance2
    Export:
      Name: !Sub '${AWS::StackName}-InstanceId2'

  PublisherPrivateIP2:
    Description: Private IP address of NPA Publisher 2
    Value: !GetAtt NPAPublisherInstance2.PrivateIp
    Export:
      Name: !Sub '${AWS::StackName}-PrivateIP2'
